name: Build Binaries

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download Dependencies
        run: |
          cd lxdapi
          go mod tidy
          go mod download

      - name: Prepare Embedded Resources
        run: |
          cd lxdapi
          rm -rf cmd/lxdapi/templates cmd/lxdapi/static
          cp -r ./lxdweb/templates cmd/lxdapi/
          cp -r ./lxdweb/static cmd/lxdapi/

      - name: Build linux/amd64
        run: |
          cd lxdapi/cmd/lxdapi
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../../lxdapi-amd64 .
          cd ../..
          ls -lh lxdapi-amd64

      - name: Build linux/arm64
        run: |
          cd lxdapi/cmd/lxdapi
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../../lxdapi-arm64 .
          cd ../..
          ls -lh lxdapi-arm64

      - name: Extract Version
        run: |
          echo "RELEASE_TAG=$(grep -oP 'Version\s*=\s*"\K[^"]+' lxdapi/pkg/version/version.go)" >> "$GITHUB_ENV"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: |
            lxdapi/lxdapi-amd64
            lxdapi/lxdapi-arm64
