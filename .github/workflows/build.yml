name: Build Binaries

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Swag
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest

      - name: Download Dependencies
        run: |
          cd lxcapi
          go mod tidy
          go mod download

      - name: Generate Swagger Docs
        run: |
          cd lxcapi
          if command -v swag &> /dev/null; then
            swag init -g cmd/lxcapi/main.go --output docs --parseDependency --parseInternal
          elif [ -f ~/go/bin/swag ]; then
            ~/go/bin/swag init -g cmd/lxcapi/main.go --output docs --parseDependency --parseInternal
          else
            echo "警告: 未找到 swag 命令，跳过 Swagger 文档生成"
          fi

      - name: Prepare Embedded Resources
        run: |
          cd lxcapi
          rm -rf cmd/lxcapi/templates cmd/lxcapi/docs cmd/lxcapi/static
          cp -r ./lxdweb/templates cmd/lxcapi/
          cp -r ./lxdweb/static cmd/lxcapi/

      - name: Build linux/amd64
        run: |
          cd lxcapi/cmd/lxcapi
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../../lxcapi-amd64 .
          cd ../..
          ls -lh lxcapi-amd64

      - name: Build linux/arm64
        run: |
          cd lxcapi/cmd/lxcapi
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../../lxcapi-arm64 .
          cd ../..
          ls -lh lxcapi-arm64

      - name: Extract Version
        run: |
          echo "RELEASE_TAG=$(grep -oP 'Version\s*=\s*"\K[^"]+' lxcapi/pkg/version/version.go)" >> "$GITHUB_ENV"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: |
            lxcapi/lxcapi-amd64
            lxcapi/lxcapi-arm64
