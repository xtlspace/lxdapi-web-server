{{define "container/container_header.html"}}
<link href="/static/fonts/inter.css" rel="stylesheet">

<script src="/static/js/iconify.min.js"></script>
    <script src="/static/js/icons-bundle.js"></script>


{{template "container/container_toast.html"}}

<style>
    body { font-family: 'Inter', sans-serif; }
    @keyframes gentlePulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.85; }
    }
    
    .animate-pulse-slow { animation: gentlePulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    
    .card-hover {
        transition: all 0.25s ease;
    }
    .card-hover:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px -8px rgba(0, 0, 0, 0.1);
    }
    
    .btn-hover {
        transition: all 0.25s ease;
    }
    .btn-hover:hover {
        transform: translateY(-1px);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .btn-hover:active {
        transform: translateY(0);
    }
    
    .smooth-transition {
        transition: all 0.25s ease;
    }

    @media (max-width: 640px) {
        .nav-logout-text {
            display: none;
        }
    }
</style>

<nav class="bg-white shadow-lg sticky top-0 z-50">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center py-3 md:py-4">
            <div class="flex items-center">
                <div class="flex items-center space-x-2">
                    <svg class="w-7 h-7 text-blue-600" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="m21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9"/></svg>
                    <h1 class="text-lg md:text-2xl font-bold text-blue-600">{{ .SystemName }}</h1>
                </div>
            </div>
            <div class="flex items-center">
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-3 md:px-4 py-2 rounded-lg text-sm font-medium btn-hover shadow-sm flex items-center gap-2">
                    <span class="iconify" data-icon="mdi:logout" data-width="16"></span>
                    <span class="nav-logout-text">退出</span>
                </button>
            </div>
        </div>
    </div>
</nav>

<script src="/static/js/jquery.min.js"></script>
<script>
function logout() {
    localStorage.removeItem('container_hash');
    window.location.href = '/container/login';
}


</script>
{{end}}
